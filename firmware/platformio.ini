[platformio]
default_envs = esp32dev

; Goal ESP32 (simulated in Wokwi). Pinned platform: arduino-esp32 2.0.17, which provides the
; ledcSetup / ledcAttachPin / ledcWriteTone API used for the buzzer.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Unit tests run on the PC (env native), not on the board.
test_ignore = *
lib_deps = throwtheswitch/Unity@^2.6.1

; Provision include/secrets.h before running this profile against the team broker.
[env:esp32net]
extends = env:esp32dev
build_flags = -DSF_NETWORK_ENABLED=1
test_ignore = *

; The deliberate serial stall command is absent from both normal profiles.
[env:esp32watchdog]
extends = env:esp32dev
build_flags = -DSF_WATCHDOG_TEST=1
test_ignore = *

; Unit tests of the pure logic: pio test -e native
[env:native]
platform = native
build_src_filter = -<*>
build_flags = -std=gnu++11 -Wall -Wextra
lib_deps = throwtheswitch/Unity@^2.6.1
lib_extra_dirs = lib
