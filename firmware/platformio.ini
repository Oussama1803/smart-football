[platformio]
default_envs = esp32dev

; Goal ESP32 (simulated in Wokwi). Pinned platform: arduino-esp32 2.0.17, which provides the
; ledcSetup / ledcAttachPin / ledcWriteTone API used for the buzzer.
[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; Unit tests run on the PC (env native), not on the board.
test_ignore = *

; Unit tests of the pure logic: pio test -e native
[env:native]
platform = native
build_src_filter = -<*>
build_flags = -std=gnu++11 -Wall -Wextra
