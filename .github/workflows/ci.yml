# Continuous integration (step 9, Mohamed)
# Runs on every push and on pull requests to main.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# The workflow only needs to read the code.
permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        run: pytest -q

  firmware-unit-tests:
    name: Firmware (pio test -e native)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Run unit tests (speed, zones, JSON)
        run: pio test -e native

  wokwi-scenario:
    name: Wokwi (shot at 72 km/h)
    runs-on: ubuntu-latest
    needs: firmware-unit-tests
    env:
      WOKWI_CLI_TOKEN: ${{ secrets.WOKWI_CLI_TOKEN }}
    steps:
      - name: Check that the Wokwi token is configured
        run: |
          if [ -z "$WOKWI_CLI_TOKEN" ]; then
            echo "::error::The WOKWI_CLI_TOKEN secret is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-esp32-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build the ESP32 firmware
        working-directory: firmware
        run: pio run -e esp32dev
      - name: Run the Wokwi scenario
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: firmware
          timeout: 30000
          scenario: scenarios/shot-72kmh.test.yaml
