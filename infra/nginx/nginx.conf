events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # Do not reveal the Nginx version in headers and error pages
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream backend_api {
        server backend:8000;
    }

    # --------------------------------------------------------------------------
    # Step 8a (Mohamed): plain HTTP only redirects to HTTPS
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # --------------------------------------------------------------------------
    # Step 8a (Mohamed): HTTPS server
    # --------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate     /etc/nginx/certs/web.crt;
        ssl_certificate_key /etc/nginx/certs/web.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;

        # Browsers must use HTTPS for this site from now on
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Frontend static assets (CSS, JS, icons)
        location /static/ {
            alias /usr/share/nginx/html/;
        }

        # Frontend dashboard static assets
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # API reverse proxy
        location /api/ {
            proxy_pass http://backend_api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }

        # Interactive API documentation
        location /docs {
            proxy_pass http://backend_api/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /openapi.json {
            proxy_pass http://backend_api/openapi.json;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Health endpoint
        location /health {
            proxy_pass http://backend_api/health;
            proxy_set_header Host $host;
        }
    }
}