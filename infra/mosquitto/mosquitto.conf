# Mosquitto Broker Configuration for Smart Football
# Initial Step 5: Plain MQTT on 1883 for local and Wokwi simulation
# Step 8a (Mohamed): Add TLS listener on 8883, certificates, ACLs, and password_file.

listener 1883
allow_anonymous true

# Persistence settings
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information

# Connection limits and keepalive
max_keepalive 60
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ==============================================================================
# STEP 8a Placeholder (TLS and Security by Mohamed)
# To enable TLS on 8883, uncomment the lines below and supply certificates:
#
# listener 8883
# cafile /mosquitto/certs/ca.crt
# certfile /mosquitto/certs/server.crt
# keyfile /mosquitto/certs/server.key
# allow_anonymous false
# password_file /mosquitto/config/passwords.txt
# acl_file /mosquitto/config/acls.txt
