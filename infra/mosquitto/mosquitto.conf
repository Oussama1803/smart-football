# Mosquitto Broker Configuration for Smart Football
# Step 8a (Mohamed): authentication, ACL and TLS.

# ------------------------------------------------------------------------------
# Security (applies to every listener)
# ------------------------------------------------------------------------------

allow_anonymous false
password_file /mosquitto/config/passwords
acl_file /mosquitto/config/acl

# ------------------------------------------------------------------------------
# Listener 1883: plain MQTT, used only by the backend inside the Docker network.
# This port must NOT be published outside Docker (see infra/compose.yaml).
# ------------------------------------------------------------------------------
listener 1883

# ------------------------------------------------------------------------------
# Listener 8883: MQTT over TLS, used by the ESP32 devices.
# ------------------------------------------------------------------------------
listener 8883
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

# ------------------------------------------------------------------------------
# Persistence
# ------------------------------------------------------------------------------
persistence true
persistence_location /mosquitto/data/

# ------------------------------------------------------------------------------
# Logging
# ------------------------------------------------------------------------------
log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# ------------------------------------------------------------------------------
# Connection limits
# ------------------------------------------------------------------------------
max_keepalive 60