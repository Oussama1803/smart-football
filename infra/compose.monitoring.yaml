# Step 10 (extension): Prometheus, Grafana and exporters.
# Used on top of compose.yaml, never alone:
#   docker compose -f compose.yaml -f compose.monitoring.yaml up -d
#
# No port is published on a public interface (Docker bypasses UFW).
# Grafana and Prometheus listen on 127.0.0.1 only: reach them with an SSH tunnel,
#   ssh -L 3000:127.0.0.1:3000 -L 9090:127.0.0.1:9090 user@VPS
# then open http://localhost:3000.

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: smartfootball-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - smartfootball_net

  grafana:
    image: grafana/grafana:12.1.1
    container_name: smartfootball-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Read-only database account for the "Appareils" table (created by infra/security/db-roles.sql).
      GF_PG_DB: ${POSTGRES_DB:-smartfootball}
      GF_PG_USER: sf_backup
      GF_PG_PASSWORD: ${DB_BACKUP_PASSWORD:-}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - smartfootball_net

  # Host CPU, RAM, disk and uptime.
  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: smartfootball-node-exporter
    restart: unless-stopped
    pid: host
    command:
      - --path.rootfs=/host
    # No ",rslave": Docker Desktop (Windows) refuses it. Only needed to see disks mounted after start.
    volumes:
      - /:/host:ro
    networks:
      - smartfootball_net

  # Availability probes: API /health, dashboard, broker TCP port.
  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: smartfootball-blackbox
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./monitoring/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - smartfootball_net

  # Broker state from the $SYS topics: connected clients, messages received.
  mosquitto-exporter:
    image: sapcc/mosquitto-exporter:0.8.0
    container_name: smartfootball-mosquitto-exporter
    restart: unless-stopped
    depends_on:
      - mosquitto
    environment:
      BROKER_ENDPOINT: tcp://mosquitto:1883
      # Once step 8a disables anonymous access, give this account read access to $SYS/#.
      MQTT_USER: ${MQTT_MONITOR_USER:-}
      MQTT_PASS: ${MQTT_MONITOR_PASSWORD:-}
    networks:
      - smartfootball_net

volumes:
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
