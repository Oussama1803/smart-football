# Step 10: what Prometheus scrapes. Every target is reached through the Docker network.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # CPU, RAM, disk, uptime of the VPS.
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Broker: connected clients, messages received, disconnected persistent clients.
  - job_name: mosquitto
    static_configs:
      - targets: ["mosquitto-exporter:9234"]

  # API availability: /health must answer 200 with "status":"healthy".
  - job_name: api_health
    metrics_path: /probe
    params:
      module: [api_healthy]
    static_configs:
      - targets: ["http://backend:8000/health"]
    relabel_configs: &blackbox_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  # Dashboard availability through Nginx.
  - job_name: web
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["http://nginx/"]
    relabel_configs: *blackbox_relabel

  # Broker availability: TCP connect on the internal MQTT port.
  - job_name: broker_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets: ["mosquitto:1883"]
    relabel_configs: *blackbox_relabel

  # Backend counters (backend/app/metrics.py): messages by type, processing errors, Last Will offline.
  # /metrics is reached through the Docker network only; Nginx does not proxy it.
  - job_name: backend
    static_configs:
      - targets: ["backend:8000"]
